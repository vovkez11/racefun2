<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mini Racing Game — Fixed</title>
<style>
  html,body { height:100%; margin:0; background:#222; display:flex; align-items:center; justify-content:center; }
  #wrap { text-align:center; }
  canvas { display:block; background:#333; border:4px solid #111; border-radius:8px; }
  p { color:#ddd; font-family:Arial, sans-serif; margin:8px 0 0; }
  .hint { color:#aaa; font-size:13px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gameCanvas"></canvas>
  <p class="hint">Controls: ← → or A D to move. Press <strong>R</strong> to restart after crash.</p>
</div>

<script>
/* ----- Config ----- */
const CSS_W = 400, CSS_H = 600;      // logical size in CSS pixels
const CAR_W = 40, CAR_H = 70;
const CAR_SPEED = 300;               // px / second
const OBST_SPEED = 180;              // px / second (initial)
const OBST_SPAWN_INTERVAL = 900;     // ms
/* ------------------ */

// Canvas and Hi-DPI scaling
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
canvas.style.width  = CSS_W + 'px';
canvas.style.height = CSS_H + 'px';
canvas.width  = Math.round(CSS_W * dpr);
canvas.height = Math.round(CSS_H * dpr);
ctx.scale(dpr, dpr);

// Game state
let car = { x: (CSS_W - CAR_W) / 2, y: CSS_H - CAR_H - 20, w: CAR_W, h: CAR_H, color: 'red' };
let keys = {};
let obstacles = [];
let lastSpawn = 0;
let lastTime = performance.now();
let running = true;
let score = 0;
let totalAliveMs = 0;
let obstacleSpeed = OBST_SPEED;

// Helpers
function rand(min, max){ return Math.random() * (max - min) + min; }
function rectsIntersect(a,b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function spawnObstacle(){
  const w = Math.round(rand(40, 100));
  const x = Math.round(rand(0, CSS_W - w));
  obstacles.push({ x, y: -60, w, h: 40 });
}

// Input
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((e.key === 'r' || e.key === 'R') && !running) restart();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// Update + Draw loop
function updateAndDraw(now){
  const dt = Math.min(40, now - lastTime); // ms
  lastTime = now;
  if (running) {
    totalAliveMs += dt;
    const delta = dt / 1000; // seconds

    // Move car
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) car.x -= CAR_SPEED * delta;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) car.x += CAR_SPEED * delta;
    // clamp
    if (car.x < 0) car.x = 0;
    if (car.x + car.w > CSS_W) car.x = CSS_W - car.w;

    // spawn obstacles periodically
    lastSpawn += dt;
    if (lastSpawn >= OBST_SPAWN_INTERVAL) {
      spawnObstacle();
      lastSpawn = 0;
      // slowly increase difficulty
      obstacleSpeed += 2;
    }

    // move obstacles
    for (let o of obstacles) o.y += obstacleSpeed * delta;
    // remove off-screen
    obstacles = obstacles.filter(o => o.y < CSS_H + 100);

    // collision
    for (let o of obstacles) {
      if (rectsIntersect({x:car.x,y:car.y,w:car.w,h:car.h}, {x:o.x,y:o.y,w:o.w,h:o.h})) {
        running = false;
        break;
      }
    }

    score = Math.floor(totalAliveMs / 100); // simple score
  }

  draw();
  requestAnimationFrame(updateAndDraw);
}

// Draw everything
function draw(){
  // background
  ctx.clearRect(0,0,CSS_W, CSS_H);
  ctx.fillStyle = '#333';
  ctx.fillRect(0,0,CSS_W,CSS_H);

  // road stripes / lane markers for depth
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(40,0,CSS_W-80,CSS_H);
  // dashed center line
  ctx.fillStyle = '#999';
  const dashH = 30, gap = 20;
  for (let y= - ( (totalAliveMs/10) % (dashH+gap) ); y < CSS_H; y += dashH + gap) {
    ctx.fillRect(CSS_W/2 - 4, y, 8, dashH);
  }

  // draw obstacles (BEHIND car so it's always visible)
  ctx.fillStyle = 'yellow';
  for (let o of obstacles) {
    ctx.fillRect(o.x, o.y, o.w, o.h);
    // small border
    ctx.strokeStyle = '#b37700';
    ctx.lineWidth = 2;
    ctx.strokeRect(o.x, o.y, o.w, o.h);
  }

  // draw car (on top)
  drawCar();

  // HUD
  ctx.fillStyle = 'white';
  ctx.font = '16px Arial';
  ctx.fillText('Score: ' + score, 10, 22);
  ctx.fillText(`Car: x=${Math.round(car.x)}, y=${Math.round(car.y)}`, 10, 42);

  if (!running) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, CSS_H/2 - 50, CSS_W, 120);
    ctx.fillStyle = 'white';
    ctx.font = '26px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('💥 Crash! Game Over', CSS_W/2, CSS_H/2 - 10);
    ctx.font = '18px Arial';
    ctx.fillText('Press R to restart', CSS_W/2, CSS_H/2 + 24);
    ctx.textAlign = 'start';
  }
  // Draw canvas border (light)
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 2;
  ctx.strokeRect(0,0, CSS_W, CSS_H);
}

function drawCar(){
  // simple car body + wheels + outline to ensure visibility
  ctx.fillStyle = car.color;
  roundRect(ctx, car.x, car.y, car.w, car.h, 6, true, false);
  // windows
  ctx.fillStyle = '#66b3ff';
  ctx.fillRect(car.x + 8, car.y + 12, car.w - 16, 18);
  // wheels
  ctx.fillStyle = '#111';
  ctx.fillRect(car.x + 6, car.y + car.h - 10, 12, 8);
  ctx.fillRect(car.x + car.w - 18, car.y + car.h - 10, 12, 8);
  // outline
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  roundRect(ctx, car.x, car.y, car.w, car.h, 6, false, true);
}

// small helper for rounded rects
function roundRect(ctx, x, y, w, h, r, fill, stroke){
  if (typeof r === 'undefined') r = 5;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

// Restart game
function restart(){
  obstacles = [];
  score = 0;
  totalAliveMs = 0;
  lastSpawn = 0;
  obstacleSpeed = OBST_SPEED;
  car.x = (CSS_W - car.w) / 2;
  running = true;
}

// start
requestAnimationFrame(now => { lastTime = now; lastSpawn = 0; requestAnimationFrame(updateAndDraw); });
// spawn a couple of obstacles a bit later so user sees car
setTimeout(spawnObstacle, 500);
setTimeout(spawnObstacle, 1200);

</script>
</body>
</html>
